<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t2 d2">
  <title id="t2">How an introgressed segment gives itself away</title>
  <desc id="d2">Two side-by-side local genealogies for a single window of the genome. On the left, an ordinary window: every haplotype finds a close relative within the last few hundred thousand years. On the right, the same window in a carrier of archaic ancestry: one haplotype has to reach back past 800,000 years before it meets anyone else, which is the signal the detector looks for.</desc>

  <defs>
    <filter id="g2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .bg    { fill: #0A0C11; }
    .panel { fill: #10131c; stroke: #232a3b; stroke-width: 1; }
    .hdr   { fill: #E7E9E6; font: 600 15px ui-monospace, "DejaVu Sans Mono", monospace; letter-spacing: .12em; }
    .sub   { fill: #8b96b0; font: 500 11px ui-monospace, "DejaVu Sans Mono", monospace; letter-spacing: .08em; }
    .note  { fill: #7d8aa6; font: 400 11.5px ui-sans-serif, system-ui, sans-serif; }
    .tick  { fill: #5c6680; font: 500 10px ui-monospace, "DejaVu Sans Mono", monospace; }
    .grid  { stroke: #1e2432; stroke-width: 1; }
    .tree  { fill: none; stroke: #C9C3B4; stroke-width: 1.8; stroke-linecap: round; }
    .deep  { fill: none; stroke: #17A48C; stroke-width: 2.6; stroke-linecap: round; filter: url(#g2); }
    .tip   { fill: #C9C3B4; }
    .tipg  { fill: #17A48C; }
    .stat  { font: 600 13px ui-monospace, "DejaVu Sans Mono", monospace; }

    .tree, .deep { stroke-dasharray: 900; stroke-dashoffset: 900; animation: dr 2s ease-out forwards; }
    .deep { animation-delay: 1.1s; }
    @keyframes dr { to { stroke-dashoffset: 0; } }

    .marker-pop { transform-origin: center; animation: pop .5s ease-out 1.6s backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    .sweep { animation: sw 3s ease-in-out infinite; }
    @keyframes sw { 0%,100% { opacity: .35 } 50% { opacity: .8 } }

    @media (prefers-reduced-motion: reduce) {
      .tree, .deep { stroke-dasharray: none; stroke-dashoffset: 0; animation: none; }
      .marker-pop { animation: none; }
      .sweep { animation: none; opacity: .6; }
    }
  </style>

  <rect class="bg" width="960" height="520"/>
  <text class="hdr" x="34" y="38">ONE WINDOW, TWO GENEALOGIES</text>
  <text class="note" x="34" y="58">The detector never looks at a sequence in isolation. It asks a single question of every 200 kb window: how far back does this haplotype have to go to meet anybody else?</text>

  <!-- shared depth axis -->
  <g class="grid">
    <line x1="70" y1="120" x2="930" y2="120"/>
    <line x1="70" y1="200" x2="930" y2="200"/>
    <line x1="70" y1="280" x2="930" y2="280"/>
    <line x1="70" y1="360" x2="930" y2="360"/>
  </g>
  <g class="tick" text-anchor="end">
    <text x="62" y="124">100 ka</text>
    <text x="62" y="204">300 ka</text>
    <text x="62" y="284">550 ka</text>
    <text x="62" y="364">850 ka</text>
  </g>

  <!-- ============ LEFT: ordinary window ============ -->
  <rect class="panel" x="76" y="96" width="380" height="300" rx="3"/>
  <text class="sub" x="78" y="88">ORDINARY WINDOW</text>

  <g class="tree" transform="translate(76,0)">
    <path d="M40,392 L40,170 L82,170 L82,392"/>
    <path d="M61,170 L61,142 L140,142 L140,392"/>
    <path d="M190,392 L190,186 L236,186 L236,392"/>
    <path d="M213,186 L213,150 L288,150 L288,392"/>
    <path d="M100,142 L100,128 L250,128"/>
    <path d="M250,128 L250,150"/>
    <path d="M175,128 L175,112 L330,112 L330,392"/>
  </g>
  <g class="tip">
    <circle cx="116" cy="392" r="3.5"/><circle cx="158" cy="392" r="3.5"/><circle cx="216" cy="392" r="3.5"/>
    <circle cx="266" cy="392" r="3.5"/><circle cx="312" cy="392" r="3.5"/><circle cx="364" cy="392" r="3.5"/>
    <circle cx="406" cy="392" r="3.5"/>
  </g>
  <g class="marker-pop">
    <circle cx="116" cy="170" r="5" fill="none" stroke="#C9C3B4" stroke-width="1.6"/>
    <text class="stat" x="132" y="174" fill="#C9C3B4">nearest relative: 240 ka</text>
  </g>
  <text class="note" x="92" y="424">Every lineage meets a cousin quickly. Nothing to explain.</text>

  <!-- ============ RIGHT: introgressed window ============ -->
  <rect class="panel" x="504" y="96" width="426" height="300" rx="3"/>
  <text class="sub" x="506" y="88">SAME WINDOW · ARCHAIC CARRIER</text>

  <g class="tree" transform="translate(504,0)">
    <path d="M40,392 L40,170 L82,170 L82,392"/>
    <path d="M61,170 L61,142 L140,142 L140,392"/>
    <path d="M190,392 L190,186 L236,186 L236,392"/>
    <path d="M213,186 L213,150 L288,150 L288,392"/>
    <path d="M100,142 L100,128 L250,128"/>
    <path d="M250,128 L250,150"/>
    <path d="M175,128 L175,112 L330,112 L330,392"/>
  </g>
  <!-- the outlier lineage plunges past everything -->
  <g class="deep" transform="translate(504,0)">
    <path d="M252,112 L252,372 L392,372 L392,392"/>
  </g>
  <g class="tip">
    <circle cx="544" cy="392" r="3.5"/><circle cx="586" cy="392" r="3.5"/><circle cx="644" cy="392" r="3.5"/>
    <circle cx="694" cy="392" r="3.5"/><circle cx="740" cy="392" r="3.5"/><circle cx="792" cy="392" r="3.5"/>
  </g>
  <circle class="tipg" cx="896" cy="392" r="5"/>

  <g class="sweep">
    <rect x="866" y="100" width="60" height="292" fill="#17A48C" opacity=".07"/>
  </g>

  <g class="marker-pop">
    <circle cx="756" cy="372" r="5" fill="none" stroke="#17A48C" stroke-width="1.8"/>
    <text class="stat" x="600" y="352" fill="#17A48C">nearest relative: 820 ka</text>
  </g>
  <text class="note" x="520" y="424" fill="#17A48C">This one has to reach past every living relative before it finds a branch to join.</text>
  <text class="note" x="520" y="442">That depth is the whole signal. No ancient DNA is involved.</text>

  <text class="note" x="34" y="484">A depth that lands near 650 ka points at Neanderthals or Denisovans — lineages we can check against real sequenced genomes. A depth that lands</text>
  <text class="note" x="34" y="502">deeper still, and matches neither, is a ghost: something that interbred with us and left no other trace.</text>
</svg>
